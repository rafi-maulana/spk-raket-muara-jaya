<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="50%" stop-color="#131C2E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <circle cx="300" cy="180" r="180" fill="url(#glowGrad)"/>

  <!-- Racket Head Frame (Oval) -->
  <ellipse cx="300" cy="160" rx="90" ry="120" fill="none" stroke="url(#frameGrad)" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="300" cy="160" rx="84" ry="114" fill="#0B0F17" fill-opacity="0.4" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Strings Grid (Cross & Main) -->
  <g stroke="#E2E8F0" stroke-opacity="0.25" stroke-width="1">
    <!-- Verticals -->
    <line x1="240" y1="90" x2="240" y2="230"/>
    <line x1="260" y1="65" x2="260" y2="255"/>
    <line x1="280" y1="50" x2="280" y2="270"/>
    <line x1="300" y1="42" x2="300" y2="278"/>
    <line x1="320" y1="50" x2="320" y2="270"/>
    <line x1="340" y1="65" x2="340" y2="255"/>
    <line x1="360" y1="90" x2="360" y2="230"/>
    <!-- Horizontals -->
    <line x1="230" y1="90" x2="370" y2="90"/>
    <line x1="218" y1="115" x2="382" y2="115"/>
    <line x1="212" y1="140" x2="388" y2="140"/>
    <line x1="210" y1="165" x2="390" y2="165"/>
    <line x1="214" y1="190" x2="386" y2="190"/>
    <line x1="222" y1="215" x2="378" y2="215"/>
    <line x1="240" y1="240" x2="360" y2="240"/>
  </g>

  <!-- T-Joint -->
  <path d="M292,278 L308,278 L305,310 L295,310 Z" fill="url(#frameGrad)"/>

  <!-- Shaft -->
  <rect x="296" y="308" width="8" height="60" fill="#38BDF8" rx="2"/>

  <!-- Cone & Handle -->
  <polygon points="293,366 307,366 310,378 290,378" fill="#1E293B"/>
  <rect x="291" y="378" width="18" height="22" fill="#0F172A" stroke="#334155" stroke-width="1"/>

  <!-- Badge Text -->
  <rect x="180" y="340" width="240" height="34" rx="8" fill="#162238" fill-opacity="0.9" stroke="url(#frameGrad)" stroke-width="1.5"/>
  <text x="300" y="362" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="1.5">
    🏸 MUARA JAYA SPORT
  </text>
</svg>
